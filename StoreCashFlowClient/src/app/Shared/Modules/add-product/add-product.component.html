<button
  (click)="openForm()"
  class="bg-grey border-border border-2 text-base font-semibold text-white px-6 py-4 rounded-2xl hover:bg-blue-600 hover:shadow-2xl transition-all duration-300">
  Добавить продукт
</button>
<div *ngIf="isFormOpen" class="fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md text-dark font-semibold">
    <h2 class="text-2xl mb-4">Добавить продукт</h2>
    <form [formGroup]="productForm">
      <div class="mb-4">
        <label class="block text-gray-700">Штрихкод</label>
        <input type="text" formControlName="barcode" class="w-full p-2 border border-gray-300 rounded mt-1"/>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700">Код группы продуктов</label>
        <input type="text" formControlName="productGroupCode" class="w-full p-2 border border-gray-300 rounded mt-1"/>

      </div>

      <div class="mb-4">
        <label class="block text-gray-700">Название</label>
        <input type="text" formControlName="name" class="w-full p-2 border border-gray-300 rounded mt-1"/>

      </div>

      <div class="mb-4">
        <label class="block text-gray-700">Вес</label>
        <input
          type="text"
          formControlName="weight"
          [ngClass]="{ 'invalid-input': weightControl?.hasError('invalidNumber') }"
          class="w-full p-2 border border-gray-300 rounded mt-1"/>
      </div>

      <div class="mb-4 flex gap-4">
        <label class="block text-gray-700">Тип продукта</label>
        <select formControlName="productTypeId">
          <option *ngFor="let type of productTypes" [ngValue]="type.id">{{ type.name }}</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700">Цена</label>
        <input
          type="text"
          formControlName="price"
          [ngClass]="{ 'invalid-input': priceControl?.hasError('invalidNumber') }"
          class="w-full p-2 border border-gray-300 rounded mt-1"/>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700">Срок годности</label>
        <input type="datetime-local" formControlName="expirationDate"
               class="w-full p-2 border border-gray-300 rounded mt-1"/>
      </div>

      <div class="flex justify-between">
        <button
          type="submit"
          [disabled]="productForm.invalid"
          (click)="onSubmit()"
          class="bg-grey text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50">
          Добавить
        </button>
        <button
          (click)="closeForm()"
          class="bg-red text-white px-4 py-2 rounded hover:bg-red-600">
          Отменить
        </button>
      </div>
    </form>
  </div>
</div>
